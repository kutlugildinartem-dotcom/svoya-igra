<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Своя игра</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1015; --surface:#181a22; --surface2:#21242f; --line:#2c303d; --text:#f2f3f7; --muted:#8b90a0;
  --accent:#7c6cff; --accent-ink:#fff; --good:#2ad1a3; --bad:#ff5e6c; --gold:#f5c542;
  --r:18px; --font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif; --display:'Unbounded','Manrope',system-ui,sans-serif;
}
[data-theme="light"]{ --bg:#f4f3ef; --surface:#ffffff; --surface2:#ecebe6; --line:#dddbd3; --text:#16171c; --muted:#757783; }
[data-theme="blue"]{ --bg:#071447; --surface:#0f2470; --surface2:#163089; --line:#2443a8; --text:#ffffff; --muted:#9fb0e8; }
[data-theme="plum"]{ --bg:#150f1d; --surface:#21182c; --surface2:#2c2139; --line:#3b2d4c; --text:#f6f0fb; --muted:#a493b6; }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;overflow:hidden;transition:background .3s}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.4}
input,textarea,select{font:inherit;color:inherit}
#app{height:100%}
.muted{color:var(--muted);font-weight:500}
.row{display:flex;align-items:center;gap:8px}.row.wrap{flex-wrap:wrap}.gap{gap:10px}.grow{flex:1}
.hint{color:var(--muted);font-size:14px;line-height:1.45;margin:10px 0 0}

/* buttons */
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:11px 18px;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .1s,filter .15s,background .15s;white-space:nowrap}
.btn:hover:not(:disabled){filter:brightness(1.08)}.btn:active:not(:disabled){transform:scale(.97)}
.btn.outline{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.outline:hover:not(:disabled){box-shadow:inset 0 0 0 1.5px var(--accent)}
.btn.ghost{background:transparent;color:var(--text)}.btn.ghost:hover{background:var(--surface2)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.lg{padding:16px 28px;font-size:18px;border-radius:14px}
.btn.xl{padding:20px 40px;font-size:22px;border-radius:16px}
.btn.good{background:var(--good);color:#06291f}.btn.bad{background:var(--bad);color:#fff}
.btn.danger{color:var(--bad)}
.icon{background:transparent;border:0;width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;color:var(--muted)}
.icon:hover:not(:disabled){background:var(--surface2);color:var(--text)}
.inp{background:var(--surface2);border:1.5px solid transparent;border-radius:10px;padding:9px 12px;width:100%;outline:none;transition:border .15s}
.inp:focus{border-color:var(--accent)}
textarea.inp{resize:vertical;line-height:1.4}
.inp.sm{padding:6px 10px;width:90px}
select.inp{cursor:pointer}
.kbd{display:inline-block;font-size:12px;padding:1px 6px;border-radius:6px;box-shadow:inset 0 0 0 1px currentColor;opacity:.6;margin-left:4px;font-weight:600}

.logo{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.02em}
.logo span{color:var(--accent);margin-left:6px}
.logo.sm{font-size:16px}

/* setup */
.setup{height:100%;display:flex;flex-direction:column;max-width:1280px;margin:0 auto;padding:24px;overflow:auto}
.setup .setup-grid{flex:none;overflow:visible}
.setup .card{overflow:visible}
.setup .setup-foot{margin-top:auto}
.setup-head{display:flex;align-items:center;gap:20px;margin-bottom:20px}
.setup-head .pack-name{color:var(--muted)}
.setup-grid{flex:1;min-height:0;display:grid;grid-template-columns:1.25fr 1fr 1fr;grid-template-rows:auto 1fr;gap:16px;overflow:auto}
.c-players{grid-row:1/span 2;grid-column:1}.c-settings{grid-row:1/span 2;grid-column:3}.c-phones{grid-row:1;grid-column:2}.c-host{grid-row:2;grid-column:2}
.qr-row{display:flex;gap:14px;align-items:flex-start}
.qr-row [data-qr]{flex:none}
.qr-row [data-qr]:empty{display:none}
.qr-row img,.qr-row canvas{background:#fff;padding:6px;border-radius:10px;width:120px;height:120px}
.big-url.sm{font-size:13px;padding:8px 10px}
.pin{font-family:var(--display);font-size:20px;color:var(--accent);letter-spacing:.1em}
.room-code{font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:.12em;color:var(--accent);line-height:1}
.host-tag{font-family:var(--font);font-size:13px;font-weight:600;margin-left:12px;padding:3px 10px;border-radius:999px;background:var(--surface)}
.card{background:var(--surface);border-radius:var(--r);padding:20px;overflow:auto}
.card h2{font-family:var(--display);font-size:17px;font-weight:700;margin:0 0 14px;display:flex;justify-content:space-between;align-items:baseline}
.players-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.prow{display:flex;gap:8px;align-items:center}
.prow.capturing .btn{background:var(--accent);color:var(--accent-ink);animation:pulse 1s infinite}
.dot{width:30px;height:30px;flex:none;border-radius:50%;border:0;background:var(--c)}
.prow .inp{flex:1;min-width:0}
.prow .btn{min-width:150px}
.setup-foot{display:flex;justify-content:flex-end;gap:12px;padding-top:18px}
.lbl{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:14px 0 6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg-b{background:var(--surface2);border:1.5px solid transparent;border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.seg-b.on{border-color:var(--accent)}
.sw{width:18px;height:18px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent;background:var(--c);display:grid;place-items:center;font-size:14px;position:relative;cursor:pointer}
.swatch.on{border-color:var(--text)}
.swatch.custom{background:var(--surface2)}
.swatch.custom input{position:absolute;inset:0;opacity:0;cursor:pointer}
.nums{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.nums label{font-size:12px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:4px}
.check{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.big-url{font-family:var(--display);font-size:18px;background:var(--surface2);padding:12px 14px;border-radius:12px;word-break:break-all;margin:8px 0}
#qr{display:flex;justify-content:center;margin:10px 0}
#qr img,#qr canvas{background:#fff;padding:8px;border-radius:12px}
.phones{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.phone-chip{background:var(--surface2);padding:8px 12px;border-radius:10px;font-size:14px;font-weight:600}

/* game */
.game{height:100%;display:grid;grid-template-rows:auto 1fr auto}
.topbar{display:flex;align-items:center;gap:16px;padding:14px 22px}
.topbar .round-title{flex:1;text-align:center;font-family:var(--display);font-weight:700;font-size:17px;color:var(--muted)}
.topbar .round-title b{color:var(--text)}
#stage{min-height:0;padding:0 22px;display:flex;flex-direction:column}
.board{flex:1;display:grid;grid-template-columns:minmax(150px,1.5fr) repeat(var(--cols),1fr);grid-template-rows:repeat(var(--rows),1fr);gap:8px;padding-bottom:14px;min-height:0}
.theme{background:var(--surface);border-radius:14px;display:flex;flex-direction:column;justify-content:center;padding:6px 18px;font-weight:800;font-size:clamp(16px,2vw,34px);line-height:1.1;overflow:hidden}
.theme small{display:block;font-weight:600;font-size:.5em;color:var(--muted);margin-top:4px}
.cell{background:var(--surface);border:0;border-radius:14px;font-family:var(--display);font-weight:800;font-size:clamp(22px,3.5vw,62px);color:var(--accent);transition:transform .12s,background .15s,color .15s;min-height:0}
[data-theme="blue"] .cell{color:var(--gold)}
.cell:hover:not(:disabled){background:var(--accent);color:var(--accent-ink);transform:scale(1.03)}
.cell.used{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.cell.empty{background:transparent}

.pbar{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:10px;padding:12px 22px 20px}
.pcard{position:relative;background:var(--surface);border:0;border-radius:16px;padding:12px 14px 14px;text-align:left;overflow:hidden;transition:transform .15s,opacity .2s,box-shadow .2s}
.pcard::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--c)}
.pcard .pname{font-weight:700;font-size:clamp(13px,1.2vw,17px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.pcard .pscore{font-family:var(--display);font-weight:700;font-size:clamp(20px,2.2vw,34px);margin-top:4px;font-variant-numeric:tabular-nums}
.pcard .pscore.neg{color:var(--bad)}
.pcard .ptag{position:absolute;top:10px;right:10px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.pcard.chooser{box-shadow:inset 0 0 0 2px var(--accent)}
.pcard.answering{box-shadow:0 0 0 3px var(--c),0 0 40px -6px var(--c);transform:translateY(-6px);background:color-mix(in srgb,var(--c) 22%,var(--surface))}
.pcard.tried{opacity:.35}
.pcard.falsestart{animation:shake .4s}
.pcard.falsestart::after{content:"ФАЛЬСТАРТ";position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bad) 85%,transparent);color:#fff;font-weight:800;letter-spacing:.08em}
.pcard.ping{animation:ping .35s}
.badge{font-size:12px;font-weight:800;padding:1px 6px;border-radius:6px;background:var(--surface2)}

/* intro & question */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:10px 0 20px;min-height:0}
.kicker{font-size:14px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.intro h1{font-family:var(--display);font-size:clamp(40px,7vw,100px);margin:0;line-height:1}
.intro-themes{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1000px;margin:10px 0 14px}
.chip{background:var(--surface);padding:12px 20px;border-radius:999px;font-weight:700;font-size:clamp(14px,1.6vw,22px);opacity:0;animation:pop .5s forwards}
.qmeta{display:flex;gap:14px;align-items:center;justify-content:center;font-weight:700;font-size:clamp(16px,1.6vw,26px);color:var(--muted)}
.qmeta .v{font-family:var(--display);color:var(--accent)}
.qmeta .tag{color:var(--accent);font-size:.85em}
.qscreen{gap:clamp(14px,2.4vh,30px)}
.qtext{font-size:clamp(32px,5vw,86px);font-weight:800;line-height:1.12;max-width:1400px;text-wrap:balance;letter-spacing:-.01em}
.qtext.emoji{font-size:clamp(80px,12vw,190px);letter-spacing:.1em}
.qtext.small{font-size:clamp(18px,1.9vw,30px);color:var(--muted);font-weight:700;max-width:1100px}
.qmedia{max-width:min(1200px,100%);min-height:0;display:flex;justify-content:center}
.qmedia img,.qmedia video{max-width:100%;max-height:46vh;border-radius:16px;object-fit:contain}
.qmedia audio{width:min(520px,90vw)}
.answer{font-family:var(--display);font-size:clamp(40px,6vw,104px);font-weight:800;color:var(--accent);line-height:1.05;max-width:1400px;text-wrap:balance}
.qlog{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-weight:700;font-size:clamp(15px,1.4vw,20px);color:var(--muted)}
.qlog .plus{color:var(--good)}.qlog .minus{color:var(--bad)}
.status{font-size:clamp(22px,2.4vw,38px);font-weight:800;min-height:1.3em}
.status .who{color:var(--c)}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:44px}
.controls .btn{padding:10px 20px;font-size:16px;border-radius:12px}
.controls .btn.ghost{color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}
body.remote .controls,body.remote .ctl{display:none!important}
.timer{width:min(700px,80%);height:6px;background:var(--surface);border-radius:999px;overflow:hidden;visibility:hidden}
.timer.on{visibility:visible}
.timer i{display:block;height:100%;width:100%;background:var(--accent);border-radius:999px;transform-origin:left;transition:transform .1s linear}
.timer.warn i{background:var(--bad)}
.big-sign{font-family:var(--display);font-size:clamp(50px,9vw,130px);font-weight:800;line-height:1}
.big-emoji{font-size:clamp(80px,12vw,170px);line-height:1}
.pick{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:1000px}
.pick button{background:var(--surface);border:0;border-radius:14px;padding:14px 22px;font-weight:800;font-size:18px;box-shadow:inset 0 4px 0 var(--c)}
.pick button:hover{background:var(--surface2)}
.pick button.on{background:var(--c);color:#111}
.mod-card{background:var(--surface);border-radius:28px;padding:30px 50px;max-width:720px;box-shadow:0 0 0 2px var(--gold),0 0 80px -20px var(--gold);animation:pop .5s}
.mod-card .e{font-size:clamp(60px,8vw,110px);line-height:1}
.mod-card .n{font-family:var(--display);font-size:clamp(26px,3.2vw,46px);font-weight:800;margin-top:8px}
.vote-opts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.vote-opts span{background:var(--surface);border-radius:14px;padding:12px 26px;font-weight:800;font-size:clamp(18px,2vw,30px);box-shadow:inset 0 0 0 2px var(--line)}
.vote-board{display:flex;flex-direction:column;gap:6px;width:min(720px,100%)}
.vote-row{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:12px;padding:8px 14px;box-shadow:inset 4px 0 0 var(--c);font-size:clamp(15px,1.5vw,20px)}
.vote-row .nm{font-weight:800;flex:1;text-align:left}
.vote-row .vv{font-weight:700;color:var(--muted);min-width:80px;text-align:left}
.vote-row .mk{font-family:var(--display);font-weight:800;width:28px;text-align:center}
.vote-row .mk.plus{color:var(--good)}.vote-row .mk.minus{color:var(--bad)}
.vote-row .ctl{display:flex;gap:6px}
.mod-card.mystery .e{animation:wobble 1.2s ease-in-out infinite}
.mod-card.reveal{animation:flip .6s ease-out}
@keyframes wobble{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-8deg) scale(1.06)}75%{transform:rotate(8deg) scale(1.06)}}
@keyframes flip{from{transform:perspective(800px) rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
.mod-card .d{color:var(--muted);font-size:clamp(16px,1.6vw,22px);font-weight:600;margin-top:8px}
.auction-form{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.auction-form .inp{width:180px;font-size:22px;text-align:center;font-family:var(--display)}

/* final & results */
.final-themes{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:1100px}
.final-themes button{background:var(--surface);border:0;border-radius:16px;padding:18px 26px;font-size:clamp(16px,1.8vw,26px);font-weight:800;transition:all .2s}
.final-themes button:hover:not(:disabled){background:var(--bad);color:#fff}
.final-themes button.gone{text-decoration:line-through;opacity:.25}
.bets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;width:min(1000px,100%)}
.bet{background:var(--surface);border-radius:16px;padding:14px;text-align:left;box-shadow:inset 0 4px 0 var(--c)}
.bet .nm{font-weight:800;margin-bottom:8px;display:flex;justify-content:space-between}
.bet .inp{font-family:var(--display);font-size:20px}
.bet .ans{margin:8px 0;font-weight:700;font-size:18px;min-height:1.4em}
.bet .row .btn{flex:1}
.bet.done{opacity:.75}
.podium{display:flex;flex-direction:column;gap:10px;width:min(700px,100%)}
.podium .pl{display:flex;align-items:center;gap:16px;background:var(--surface);border-radius:16px;padding:14px 20px;box-shadow:inset 6px 0 0 var(--c);animation:pop .5s backwards}
.podium .pl.first{padding:22px 24px;box-shadow:inset 6px 0 0 var(--c),0 0 0 2px var(--gold)}
.podium .pl .pos{font-family:var(--display);font-weight:800;font-size:22px;width:40px;color:var(--muted)}
.podium .pl .nm{flex:1;text-align:left;font-weight:800;font-size:22px}
.podium .pl .sc{font-family:var(--display);font-weight:800;font-size:26px}
.podium .pl.first .nm,.podium .pl.first .sc{font-size:32px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:100;animation:fade .15s}
.modal{background:var(--surface);border-radius:22px;padding:24px;width:min(460px,92vw);max-height:90vh;overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
.modal h3{font-family:var(--display);margin:0 0 14px;font-size:20px}
.modal.wide{width:min(900px,94vw);display:flex;flex-direction:column;height:86vh}
.bank-head{display:flex;justify-content:space-between;align-items:baseline}
.bank-head h3 .muted{font-family:var(--font);font-size:14px;margin-left:8px}
.bank-list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;padding-right:4px}
.bank-t{background:var(--surface2);border-radius:12px}
.bank-t summary{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;list-style:none}
.bank-t summary::-webkit-details-marker{display:none}
.bank-t summary .muted{font-size:13px}
.bank-q{display:flex;gap:12px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);font-size:14px}
.bank-q .muted{font-size:13px;margin-top:2px}
.bank-q .diff{color:var(--accent);font-size:9px;letter-spacing:1px;width:46px;flex:none}
.reg-status{font-size:13px;font-weight:700;padding:8px 12px;border-radius:10px;background:var(--surface2)}
.reg-status.warn{color:var(--gold)}
.reg-q{background:var(--surface2);border-radius:12px;overflow:hidden}
.reg-q .bank-q{border-top:0}
.reg-tag{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding:8px 14px 0}
#toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:11px 20px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .2s,transform .2s;z-index:300;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.menu-list{display:flex;flex-direction:column;gap:6px}
.menu-list .btn{justify-content:flex-start}

/* editor */
.editor{height:100%;display:grid;grid-template-columns:230px 1fr auto}
.ed-nav{background:var(--surface);padding:18px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.ed-nav .logo{padding:0 8px 14px}
.nav-b{background:transparent;border:0;text-align:left;padding:10px 12px;border-radius:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-b:hover{background:var(--surface2)}.nav-b.on{background:var(--accent);color:var(--accent-ink)}
.nav-b.add{color:var(--muted);font-weight:600}
.nav-b[data-round]{cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;position:relative}
.nav-b .grip{opacity:.35;margin-right:7px;font-size:12px}
.nav-b[data-round]:hover .grip{opacity:.8}
.ed-game{font-size:12px;font-weight:800;color:var(--muted);padding:0 12px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* перетаскивание */
body.dragging-any,body.dragging-any *{cursor:grabbing!important;user-select:none!important}
#drag-ghost{position:fixed;left:0;top:0;z-index:500;pointer-events:none;background:var(--surface);color:var(--text);border-radius:12px;padding:10px 14px;font-weight:800;font-size:14px;box-shadow:0 14px 34px rgba(0,0,0,.45),inset 0 0 0 2px var(--accent);max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drag-src{opacity:.35}
.nav-b.drop-before{box-shadow:inset 0 3px 0 var(--accent)}
.nav-b.drop-after{box-shadow:inset 0 -3px 0 var(--accent)}
.nav-b.drop-into,.ed-cell.drop-into{outline:2px dashed var(--accent);outline-offset:2px}

/* «+» и список игр на рамке названия */
.title-wrap{position:relative;display:flex;align-items:center;flex:1;min-width:260px;max-width:520px}

.games{position:absolute;right:8px;top:50%;transform:translateY(-50%);z-index:40}
.games.inline{position:relative;right:auto;top:auto;transform:none}
.games-plus{width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:26px;font-weight:800;line-height:1;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3);padding:0 0 3px}

@keyframes plus-spin{to{transform:rotate(1080deg)}}

.games-pop{position:absolute;right:0;top:100%;padding-top:10px;pointer-events:none}
.games-menu{width:320px;background:var(--surface);border-radius:16px;padding:8px;box-shadow:0 20px 44px rgba(0,0,0,.5),inset 0 0 0 1px var(--line);opacity:0;transform:translateY(-10px) scale(.96);transform-origin:top right;transition:opacity .2s,transform .2s;max-height:70vh;overflow:auto}
.games:hover .games-pop,body.dragging-any .games-pop{pointer-events:auto}

.game-item .gmeta{font-size:11px;color:var(--accent);font-weight:800}
.game-item .gdel{width:28px;height:28px;opacity:.5}

.game-item.arming{background:var(--surface2)}

@keyframes arm-fill{from{width:0}to{width:100%}}
.game-select{width:auto!important;max-width:260px;padding:6px 10px!important}
.ed-save{font-size:12px;color:var(--muted);padding:8px 12px}
.ed-main{overflow:auto;padding:22px 26px 60px}
.ed-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.ed-head label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600}

.ed-board{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.ed-theme{display:grid;grid-template-columns:220px repeat(var(--n),minmax(96px,1fr)) 48px;gap:8px;overflow-x:auto}
.ed-tcol{background:var(--surface);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}

.ed-cell{background:var(--surface);border:2px solid transparent;border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:96px;overflow:hidden}
.ed-cell:hover{border-color:var(--line)}.ed-cell.on{border-color:var(--accent)}
.ed-cell[draggable]{cursor:grab}
.ed-cell.dragging{opacity:.4}
.ed-cell.over{border-color:var(--accent);border-style:dashed;transform:scale(1.03)}
.nav-b.small{font-size:14px;margin-top:6px;box-shadow:inset 0 0 0 1.5px var(--line)}
.ed-cell b{font-family:var(--display);color:var(--accent);font-size:17px}
.ed-cell .ico{font-size:13px;min-height:16px}

.ed-side{width:400px;background:var(--surface);overflow:auto;padding:18px 20px 40px;border-left:1px solid var(--line)}

.media-ed{margin-top:8px}

.media-prev img,.media-prev video{max-width:100%;max-height:180px;border-radius:8px}
.media-prev audio{width:100%}
.media-prev .icon{position:absolute;top:6px;right:6px;background:var(--surface)}
label.file{cursor:pointer}
.ed-list{display:flex;flex-direction:column;gap:10px;max-width:900px}
.ed-item{background:var(--surface);border-radius:14px;padding:14px;display:grid;gap:8px}

.mod-grid{display:grid;grid-template-columns:70px 1fr 200px 110px auto;gap:8px;align-items:center}

.stat{display:flex;gap:28px;margin:14px 0 22px;flex-wrap:wrap}
.stat div{font-size:13px;color:var(--muted);font-weight:600}.stat b{display:block;font-family:var(--display);font-size:24px;color:var(--text)}

@keyframes pulse{50%{filter:brightness(1.35)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes ping{50%{transform:scale(1.06);box-shadow:0 0 0 3px var(--c)}}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(10px)}to{opacity:1;transform:none}}
