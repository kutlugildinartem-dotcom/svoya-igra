services:
  - type: web
    name: svoya-igra
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /api/info
    autoDeploy: true
    envVars:
      - key: GITHUB_REPO
        value: kutlugildinartem-dotcom/svoya-igra
      - key: GITHUB_BRANCH
        value: registry
      - key: GITHUB_TOKEN
        sync: false
